name: pgdock_auth_sample
description: Sign in with a WhatsApp code or Google against a PGDock project, then read rows that row-level security scopes to the user's org.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  flutter_web_auth_2: ^3.1.0
  flutter_secure_storage: ^9.2.0

flutter:
  uses-material-design: true
