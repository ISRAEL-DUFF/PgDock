      type: object
      required: [name, endpoint, bucket]
      properties:
        name:
          type: string
          maxLength: 100
        endpoint:
          type: string
          example: https://s3.eu-central-1.amazonaws.com
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        access_key:
          type: string
          description: Empty on an update keeps the stored one.
        secret_key:
          type: string
          description: Empty on an update keeps the stored one.
        path_style:
          type: boolean
        is_default:
          type: boolean
          description: Platform targets only.
    StorageTargetTestRequest:
      type: object
      required: [endpoint, bucket]
      properties:
        target_id:
          type: string
          format: uuid
          description: A stored target whose credentials fill in empty ones.
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        access_key:
          type: string
        secret_key:
          type: string
        path_style:
          type: boolean
    StorageTarget:
      type: object
      required: [id, name, kind, endpoint, bucket, prefix, region, path_style, is_default, created_at, usage]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/StorageTargetKind"
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        path_style:
          type: boolean
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/StorageTargetUsage"
    StorageTargetUsage:
      type: object
      required: [projects, backups, bytes]
      properties:
        projects:
          type: integer
          description: Live projects whose new backups go here.
        backups:
          type: integer
          description: Unexpired backups stored here.
        bytes:
          type: integer
          format: int64
    StorageTargetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StorageTarget"
    StorageTargetSaveResult:
      type: object
      required: [saved, test]
      properties:
        saved:
          type: boolean
        test:
          $ref: "#/components/schemas/StorageTestResult"
        target:
          $ref: "#/components/schemas/StorageTarget"
    ProjectStorageChoice:
      type: object
      required: [kind, name, is_default]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Null is the platform default (followed if it changes).
        kind:
          $ref: "#/components/schemas/StorageTargetKind"
        name:
          type: string
        is_default:
          type: boolean
    ProjectBackupKey:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: False means new backups use the instance key.
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: The OpenPGP fingerprint, as gpg shows it.
        created_at:
          type: string
          format: date-time
    ProjectBackupKeyRequest:
      type: object
      properties:
        rotate:
          type: boolean
          description: Replace an existing key; backups made with the old one keep it.
    ProjectBackupStorage:
      type: object
      required: [target, key, choices, counts_toward_quota]
      properties:
        target:
          $ref: "#/components/schemas/ProjectStorageChoice"
        key:
          $ref: "#/components/schemas/ProjectBackupKey"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ProjectStorageChoice"
        counts_toward_quota:
          type: boolean
          description: Whether new backups count against the organisation's backup quota (platform targets do).
    ProjectStorageTargetRequest:
      type: object
      properties:
        target_id:
          type: string
          format: uuid
          nullable: true
        copy_existing:
          type: boolean
        delete_originals:
          type: boolean
    ProjectStorageTargetResult:
      type: object
      required: [storage]
      properties:
        storage:
          $ref: "#/components/schemas/ProjectBackupStorage"
        operation:
          $ref: "#/components/schemas/Operation"
    StorageRequest:
      type: object
      required: [endpoint, bucket, access_key]
      properties:
        endpoint:
          type: string
          example: https://s3.eu-central-1.amazonaws.com
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        access_key:
          type: string
        secret_key:
          type: string
        path_style:
          type: boolean
    StorageSettings:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        access_key:
          type: string
        path_style:
          type: boolean
    StorageTestStep:
      type: object
      required: [step, ok, took_ms]
      properties:
        step:
          type: string
        ok:
          type: boolean
        error:
          type: string
        took_ms:
          type: integer
    StorageTestResult:
      type: object
      required: [ok, saved, steps]
      properties:
        ok:
          type: boolean
        saved:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StorageTestStep"
    BackupKeyInfo:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        fingerprint:
          type: string
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
    BackupKeyExport:
      type: object
      required: [key, info]
      properties:
        key:
          type: string
          description: Store it offline; without it the backups cannot be decrypted.
        info:
          $ref: "#/components/schemas/BackupKeyInfo"
    BackupKeyConfirmRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
    ImportSource:
      type: object
      required: [source_url]
      properties:
        source_url:
          type: string
          example: postgresql://postgres:secret@db.abcd.supabase.co:5432/postgres
    ImportRequest:
      type: object
      required: [source_url, name, schemas]
      properties:
        org_id:
          type: string
          format: uuid
          description: The organisation; your personal organisation when omitted.
        source_url:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 1000
        schemas:
          type: array
          minItems: 1
          items:
            type: string
    ImportPreflight:
      type: object
      required: [server_version, size_bytes, supabase, schemas, default_schemas, extensions, role_references, warnings]
      properties:
        server_version:
          type: string
        size_bytes:
          type: integer
          format: int64
        supabase:
          type: boolean
        schemas:
          type: array
          items:
            type: object
            required: [name, tables, managed]
            properties:
              name:
                type: string
              tables:
                type: integer
              managed:
                type: boolean
        default_schemas:
          type: array
          items:
            type: string
        extensions:
          type: array
          items:
            type: object
            required: [name, version, schema, allowed]
            properties:
              name:
                type: string
              version:
                type: string
              schema:
                type: string
              allowed:
                type: boolean
        role_references:
          type: array
          items:
            type: object
            required: [kind, schema, table, name, roles]
            properties:
              kind:
                type: string
                enum: [policy, grant]
              schema:
                type: string
              table:
                type: string
              name:
                type: string
              roles:
                type: array
                items:
                  type: string
        warnings:
          type: array
          items:
            type: string
    Node:
      type: object
      required: [id, name, private_addr, role, status, created_at, agent]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        private_addr:
          type: string
        role:
          type: string
        status:
          type: string
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        agent:
          $ref: "#/components/schemas/AgentStatus"
    AgentStatus:
      type: object
      required: [registered, reachable]
      properties:
        registered:
          type: boolean
        reachable:
          type: boolean
        address:
          type: string
        version:
          type: string
        cert_fingerprint:
          type: string
        error:
          type: string
        checked_at:
          type: string
          format: date-time
        pg_dump:
          type: string
        docker:
          type: string
          description: '"ok" when the agent can run instances, else why not.'
        image:
          type: string
        metrics:
          type: object
          additionalProperties: true
    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"
    RegistrationToken:
      type: object
      required: [token, expires_at, command]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        command:
          type: string
          description: A ready-to-run registration command for the node.
    AgentRegisterRequest:
      type: object
      required: [token, csr]
      properties:
        token:
          type: string
        node:
          type: string
        csr:
          type: string
        advertise_host:
          type: string
        advertise_port:
          type: integer
        version:
          type: string
    AgentRegisterResponse:
      type: object
      required: [node_id, cert_pem, ca_pem]
      properties:
        node_id:
          type: string
        cert_pem:
          type: string
        ca_pem:
          type: string
    InstanceSummary:
      type: object
      required: [id, kind, status, node_id, node_name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [shared, dedicated]
        status:
          type: string
        error:
          type: string
          nullable: true
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
        profile:
          type: string
          nullable: true
        cpus:
          type: number
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        volume_gb:
          type: integer
          nullable: true
    PitrWindow:
      type: object
      description: Dedicated only. Any time in [from, to] can be restored.
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    PitrRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        target_time:
          type: string
          format: date-time
          description: Omit for the latest point.
    InstanceActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart]
    InstanceState:
      type: object
      required: [state, running]
      properties:
        state:
          type: string
        running:
          type: boolean
        container:
          type: string
    Profile:
      type: object
      required: [name, cpus, memory_mb]
      properties:
        name:
          type: string
        cpus:
          type: number
        memory_mb:
          type: integer
    ProfileList:
      type: object
      required: [items, default_profile, default_volume_gb]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        default_profile:
          type: string
        default_volume_gb:
          type: integer
    CreateNodeRequest:
      type: object
      required: [name, private_addr, role]
      properties:
        name:
          type: string
          example: node-b
        private_addr:
          type: string
          description: The node's address on the private network (poolers and the control plane reach it here).
          example: 10.0.0.12
        role:
          type: string
          enum: [shared, dedicated, both]
    NodeCreated:
      type: object
      required: [node, token, expires_at, command]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        command:
          type: string
    NodeDetail:
      type: object
      required: [node, instances]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/NodeInstance"
    NodeInstance:
      type: object
      required: [id, kind, status, projects]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        error:
          type: string
          nullable: true
        profile:
          type: string
          nullable: true
        cpus:
          type: number
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        volume_gb:
          type: integer
          nullable: true
        address:
          type: string
        projects:
          type: integer
        created_at:
          type: string
          format: date-time
    SharedClusterRequest:
      type: object
      required: [memory_mb]
      properties:
        memory_mb:
          type: integer
          minimum: 512
    UpdateNodeRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [shared, dedicated, both]
    PromotionEstimate:
      type: object
      required: [size_bytes, estimated_downtime_seconds]
      properties:
        size_bytes:
          type: integer
          format: int64
        estimated_downtime_seconds:
          type: integer
          description: Roughly dump + restore time, while writes wait.
    DemoteRequest:
      type: object
      properties:
        node_id:
          type: string
          format: uuid
          description: The node whose shared cluster takes the project (default the one with the most free capacity).
        console_writable:
          type: boolean
          description: Turn the read-only SQL console off (V2 §5.5); otherwise it keeps its current setting.
        accept_warnings:
          type: boolean
          description: Acknowledge the preflight's warnings (peak connections, settings that reset).
    DemoteCheck:
      type: object
      required: [name, status, message]
      properties:
        name:
          type: string
          enum: [size, extensions, roles, allowance, connections, settings, capacity]
        status:
          type: string
          enum: [ok, warning, blocked]
        message:
          type: string
    DemoteTarget:
      type: object
      required: [node_id, node_name, org_cluster]
      properties:
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
        org_cluster:
          type: boolean
          description: The organisation's own shared cluster (V2 §10.5).
        free_bytes:
          type: integer
          format: int64
          nullable: true
          description: The node's free disk at its last measurement.
    DemotePreflight:
      type: object
      required: [eligible, checks, size_bytes, estimated_downtime_seconds, settings_after, resets, retain_hours]
      properties:
        eligible:
          type: boolean
          description: No check blocks the demotion (warnings still need accept_warnings).
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DemoteCheck"
        size_bytes:
          type: integer
          format: int64
        estimated_downtime_seconds:
          type: integer
          description: Roughly dump + restore time, while writes wait.
        target:
          $ref: "#/components/schemas/DemoteTarget"
        settings_after:
          $ref: "#/components/schemas/ProjectSettings"
        resets:
          type: array
          description: The guardrails that change, e.g. "connection limit 90 → 20".
          items:
            type: string
        retain_hours:
          type: integer
          description: How long the stopped dedicated instance is kept before it is destroyed.
    PromoteRequest:
      type: object
      properties:
        node_id:
          type: string
          format: uuid
        profile:
          type: string
        volume_gb:
          type: integer
          minimum: 1
          maximum: 16384
        reason:
          type: string
          description: Why, when the promotion is beyond the organisation's dedicated allowance and becomes a request.
    SqlRequest:
      type: object
      required: [query, query_id]
      properties:
        query:
          type: string
          minLength: 1
        query_id:
          type: string
          format: uuid
          description: Chosen by the client, to cancel the query.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
        read_only:
          type: boolean
          description: Run read-only even if the project's console is not.
    SqlColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
    SqlStatementResult:
      type: object
      required: [command, columns, rows, row_count, truncated]
      properties:
        command:
          type: string
          description: The command tag, e.g. "SELECT 3" or "INSERT 0 1".
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SqlColumn"
        rows:
          type: array
          items:
            type: array
            items:
              type: string
              nullable: true
        row_count:
          type: integer
          format: int64
        truncated:
          type: boolean
          description: More rows than the 1,000 shown.
    SqlError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        detail:
          type: string
        hint:
          type: string
        position:
          type: integer
    SqlResult:
      type: object
      required: [results, notices, read_only, duration_ms]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SqlStatementResult"
        notices:
          type: array
          items:
            type: string
        error:
          $ref: "#/components/schemas/SqlError"
        read_only:
          type: boolean
        duration_ms:
          type: integer
          format: int64
    SqlCancelRequest:
      type: object
      required: [query_id]
      properties:
        query_id:
          type: string
          format: uuid
    SqlCancelResult:
      type: object
      required: [cancelled]
      properties:
        cancelled:
          type: boolean
    DbSchema:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/DbSchemaNode"
    DbSchemaNode:
      type: object
      required: [name, tables]
      properties:
        name:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/DbTable"
    DbTable:
      type: object
      required: [name, kind, size_bytes, primary_key, columns, indexes]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [table, partitioned_table, view, materialized_view, foreign_table]
        row_estimate:
          type: integer
          format: int64
          nullable: true
          description: From the planner's statistics; null before the first ANALYZE.
        size_bytes:
          type: integer
          format: int64
        comment:
          type: string
          nullable: true
        primary_key:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/DbColumn"
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/DbIndex"
    DbColumn:
      type: object
      required: [name, type, nullable]
      properties:
        name:
          type: string
        type:
          type: string
        nullable:
          type: boolean
        default:
          type: string
          nullable: true
    DbIndex:
      type: object
      required: [name, definition, primary, unique]
      properties:
        name:
          type: string
        definition:
          type: string
        primary:
          type: boolean
        unique:
          type: boolean
    TablePage:
      type: object
      required: [columns, rows, order, key_columns]
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SqlColumn"
        rows:
          type: array
          items:
            type: array
            items:
              type: string
              nullable: true
        next:
          type: string
          description: Cursor of the next page; absent on the last.
        order:
          type: string
          enum: [primary_key, ctid, offset]
        key_columns:
          type: array
          items:
            type: string
        xmin:
          type: array
          description: Each row's xmin, for editable tables.
          items:
            type: string
        large_offset:
          type: boolean
          description: Offset paging this deep is slow; sort by the primary key or filter.
    TableInfo:
      type: object
      required: [schema, name, kind, primary_key, columns, foreign_keys, constraints, indexes, size_bytes, editable]
      properties:
        schema:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [table, partitioned_table, view, materialized_view, foreign_table]
        primary_key:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/EditColumn"
        foreign_keys:
          type: array
          items:
            $ref: "#/components/schemas/ForeignKey"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/TableConstraint"
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/DbIndex"
        size_bytes:
          type: integer
          format: int64
        row_estimate:
          type: integer
          format: int64
          nullable: true
        editable:
          type: boolean
        read_only_reason:
          type: string
    EditColumn:
      type: object
      required: [name, type, nullable, category, base_type, generated]
      properties:
        name:
          type: string
        type:
          type: string
        nullable:
          type: boolean
        default:
          type: string
          nullable: true
        category:
          type: string
          description: pg_type.typcategory (B boolean, N numeric, S string, D date/time, U user, E enum, A array…).
        base_type:
          type: string
        enum_values:
          type: array
          items:
            type: string
        generated:
          type: boolean
        identity:
          type: string
          enum: [always, by_default]
    ForeignKey:
      type: object
      required: [name, columns, ref_schema, ref_table, ref_columns, on_delete, on_update]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            type: string
        ref_schema:
          type: string
        ref_table:
          type: string
        ref_columns:
          type: array
          items:
            type: string
        on_delete:
          type: string
        on_update:
          type: string
    TableConstraint:
      type: object
      required: [name, kind, definition]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [check, unique, primary_key, foreign_key, exclusion]
        definition:
          type: string
    RowChange:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [insert, update, delete]
        key:
          type: object
          description: The row's primary key (update, delete).
          additionalProperties:
            type: string
            nullable: true
        xmin:
          type: string
          description: The row's xmin when loaded (update, delete).
        values:
          type: object
          description: Column values as text, null for NULL. Columns left out of an insert get their default.
          additionalProperties:
            type: string
            nullable: true
    SaveRowsRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/RowChange"
    SaveRowsResult:
      type: object
      required: [applied, rows, columns, summary]
      properties:
        applied:
          type: boolean
        summary:
          type: string
          example: 3 updates, 1 insert, 2 deletes
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SqlColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SavedRow"
        conflict:
          $ref: "#/components/schemas/RowConflict"
        failed:
          $ref: "#/components/schemas/FailedChange"
    SavedRow:
      type: object
      required: [index, xmin, values]
      properties:
        index:
          type: integer
        xmin:
          type: string
        values:
          type: array
          items:
            type: string
            nullable: true
    RowConflict:
      type: object
      required: [index, deleted]
      properties:
        index:
          type: integer
          description: The change that hit a row someone else changed.
        deleted:
          type: boolean
        xmin:
          type: string
        current:
          type: array
          items:
            type: string
            nullable: true
    FailedChange:
      type: object
      required: [index, error]
      properties:
        index:
          type: integer
          description: The change Postgres refused (-1 for a constraint checked at commit).
        error:
          $ref: "#/components/schemas/SqlError"
    SchemaColumnDef:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          example: text
        nullable:
          type: boolean
          default: true
        default:
          type: string
          description: An SQL expression, e.g. now() or 'draft'.
        primary_key:
          type: boolean
        comment:
          type: string
    SchemaChange:
      type: object
      required: [kind]
      description: One change (V2 §4.3); which fields apply depends on `kind`.
      properties:
        kind:
          type: string
          enum: [create_schema, drop_schema, create_table, rename_table, drop_table, add_column, rename_column, drop_column, alter_column, add_check, add_unique, add_foreign_key, drop_constraint, create_index, drop_index, create_enum, add_enum_value]
        schema:
          type: string
          default: public
        table:
          type: string
        name:
          type: string
          description: The schema, constraint, index or type created or dropped.
        new_name:
          type: string
        column:
          $ref: "#/components/schemas/SchemaColumnDef"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SchemaColumnDef"
        column_name:
          type: string
        comment:
          type: string
        type:
          type: string
        using:
          type: string
        default:
          type: string
        drop_default:
          type: boolean
        nullable:
          type: boolean
        expression:
          type: string
        key_columns:
          type: array
          items:
            type: string
        ref_schema:
          type: string
        ref_table:
          type: string
        ref_columns:
          type: array
          items:
            type: string
        on_delete:
          type: string
          enum: [NO ACTION, RESTRICT, CASCADE, SET NULL, SET DEFAULT]
        on_update:
          type: string
          enum: [NO ACTION, RESTRICT, CASCADE, SET NULL, SET DEFAULT]
