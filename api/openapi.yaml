      required: [totp_secret, totp_uri, expires_at]
      properties:
        totp_secret:
          type: string
        totp_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    TotpRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
    ReauthRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_implemented
        message:
          type: string
        quota:
          $ref: "#/components/schemas/QuotaItem"
        sql_error:
          $ref: "#/components/schemas/SqlError"
        statement:
          type: string
          description: The DDL statement Postgres refused.
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    OperationLogEntry:
      type: object
      required: [ts, step, level, msg]
      properties:
        ts:
          type: string
          format: date-time
        step:
          type: string
        level:
          type: string
          enum: [info, warn, error]
        msg:
          type: string
    Operation:
      type: object
      required: [id, kind, params, status, attempts, run_after, log, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: create
        project_id:
          type: string
          format: uuid
          nullable: true
        params:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        run_after:
          type: string
          format: date-time
        log:
          type: array
          items:
            $ref: "#/components/schemas/OperationLogEntry"
        error:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    OperationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
    OperationStatusEvent:
      type: object
      required: [status, attempts]
      properties:
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        error:
          type: string
          nullable: true
    NoopParams:
      type: object
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 3
        delay_ms:
          type: integer
          minimum: 0
          maximum: 10000
          default: 500
        fail_attempts:
          type: integer
          minimum: 0
          default: 0
          description: Fail the first N attempts to exercise retries.
    ProjectStatus:
      type: string
      enum: [provisioning, active, promoting, demoting, restoring, deleting, error]
    ProjectTier:
      type: string
      enum: [shared, dedicated]
    ConnectionInfo:
      type: object
      required: [host, session_port, pooled_port, database, user, sslmode, pooled_url, session_url]
      properties:
        host:
          type: string
          example: db.example.com
        session_port:
          type: integer
          example: 5432
        pooled_port:
          type: integer
          example: 6543
        database:
          type: string
          example: blog_k2f9
        user:
          type: string
          example: blog_k2f9_owner
        sslmode:
          type: string
          example: require
        pooled_url:
          type: string
          description: Transaction-mode URL (app traffic). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:6543/blog_k2f9?sslmode=require
        session_url:
          type: string
          description: Session-mode URL (migrations). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:5432/blog_k2f9?sslmode=require
    Project:
      type: object
      required: [id, org_id, name, slug, db_name, owner_role, tier, status, settings, created_at, connection]
      properties:
        parent_project_id:
          type: string
          format: uuid
          nullable: true
          description: Set for a branch (V2 §8).
        branch:
          $ref: "#/components/schemas/BranchInfo"
        sensitive_data:
          type: boolean
        branch_count:
          type: integer
          description: Live branches of this project.
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        my_role:
          $ref: "#/components/schemas/ProjectRole"
        storage_state:
          $ref: "#/components/schemas/StorageState"
        can_switch_credentials:
          type: boolean
          description: A V1 project that still uses its V1 owner role (V2 §10.2).
        legacy_credentials_until:
          type: string
          format: date-time
          nullable: true
          description: The V1 credentials stop working at this time.
        name:
          type: string
        slug:
          type: string
        db_name:
          type: string
        owner_role:
          type: string
        tier:
          $ref: "#/components/schemas/ProjectTier"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: string
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettings"
        created_at:
          type: string
          format: date-time
        connection:
          $ref: "#/components/schemas/ConnectionInfo"
        last_backup_at:
          type: string
          format: date-time
          nullable: true
          description: When the latest backup of this project finished.
        instance:
          $ref: "#/components/schemas/InstanceSummary"
        pitr_window:
          $ref: "#/components/schemas/PitrWindow"
        retired_copy_until:
          type: string
          format: date-time
          nullable: true
          description: |
            After a promotion, when the read-only shared copy is dropped;
            after a demotion, when the stopped dedicated instance is
            destroyed (and the dedicated allowance released).
    ProjectSettings:
