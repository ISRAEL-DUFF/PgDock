        commit:
          type: string
          example: 15506e9
        build_date:
          type: string
          example: "2026-10-01T00:00:00Z"
        go_version:
          type: string
          example: go1.25.0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginChallenge:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
        enrollment:
          $ref: "#/components/schemas/LoginEnrollment"
    LoginEnrollment:
      description: First sign-in - enrol this authenticator; the next code completes it.
