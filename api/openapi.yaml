    get:
      operationId: listSharedClusters
      summary: Shared clusters and the organisation each is reserved for (platform admin)
      tags: [admin]
      responses:
        "200":
          description: Clusters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedClusterList"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    SchemaName:
      name: schema
      in: path
      required: true
      schema:
        type: string
    TableName:
      name: table
      in: path
      required: true
      schema:
        type: string
    TargetID:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AcceptUnrestorable:
      name: accept_unrestorable
      in: query
      description: Delete even though the target holds unexpired backups, which become unrestorable.
      schema:
        type: boolean
        default: false
    TokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestID:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgID:
      name: org
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgQuery:
      name: org
      in: query
      description: The organisation to list; your personal organisation when omitted.
      schema:
        type: string
        format: uuid
    AuditAction:
      name: action
      in: query
      description: Action prefix, e.g. `project.` or `auth.login`.
      schema:
        type: string
    AuditOutcome:
      name: outcome
      in: query
      schema:
        type: string
        enum: [success, failure, denied]
    AuditTarget:
      name: target_id
      in: query
      schema:
        type: string
    AuditBefore:
      name: before
      in: query
      description: Return entries with an id below this (pagination).
      schema:
        type: integer
        format: int64
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    MetricRange:
      name: range
      in: query
      schema:
        type: string
        enum: [1h, 24h, 7d]
        default: 24h
    MetricNames:
      name: metric
      in: query
      description: Metrics to return; all when omitted.
      schema:
        type: array
        items:
          type: string
    BackupID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
