          $ref: "#/components/responses/Error"
  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Create an account (when the signup mode allows it)
      description: |
        Public and rate-limited. The account stays inactive until its email
        is verified (and, in approval mode, the platform admin approves it).
        The answer is the same whether or not the address already has an
        account.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Check your email for a verification link.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with the emailed token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/verify-email/resend:
    post:
      operationId: resendVerification
      summary: Send a new verification link
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: If the address has an unverified account, a link is on its way.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Email a password reset link (valid one hour)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: If the address has an account, a link is on its way.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password from a reset link; ends every session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: Password changed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/terms:
    get:
      operationId: getTerms
      summary: The current terms of use and privacy notice (public)
      tags: [auth]
      responses:
        "200":
          description: Current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terms"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations/preview:
    post:
      operationId: previewInvitation
      summary: What an invitation link offers (public, token-gated)
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation link (public, token-gated)
      description: |
        Signed in, accepts for the current account (which must have the
        invited address). Otherwise creates the account from `name`,
        `password`, and `terms_version`, and returns a login challenge that
        enrols the authenticator.
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: Change your password; ends your other sessions
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/tokens:
    get:
      operationId: listMyTokens
      summary: Your API tokens (only the calling token's organisation, with a token)
      tags: [tokens]
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createToken
      summary: Create an API token, shown once
      description: |
        A token acts in one organisation, with additive scopes (read, write,
        admin; admin requires write), optionally restricted to some
        projects, until it expires (default 90 days, at most the platform
        maximum). Created with a token, the new one can't exceed the
        caller's scopes, projects, or expiry.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/tokens/{token_id}:
    delete:
      operationId: revokeMyToken
      summary: Revoke one of your tokens
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/TokenID"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/storage-targets:
    get:
      operationId: listOrgStorageTargets
      summary: The organisation's own backup storage targets (owners and admins)
      description: Org targets are buckets the organisation brings; backups there don't count against its backup quota (V2 §6).
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrgStorageTarget
      summary: Add an org target after a live test
      description: Runs the write/read/list/delete test under the prefix and saves only if it passes (`saved`). Credentials are sealed with the master key and never shown again.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: The test failed; nothing was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/storage-targets/{target_id}:
    get:
      operationId: getOrgStorageTarget
      summary: One org target (never its credentials)
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TargetID"
      responses:
        "200":
          description: Target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTarget"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrgStorageTarget
      summary: Change an org target after a live test
      description: Empty `access_key` or `secret_key` keep the stored ones.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TargetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: Test result; `saved` says whether the target changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOrgStorageTarget
      summary: Delete an org target
      description: |
        Refused (409 `target_in_use`) while a project uses it, and while it
        holds unexpired backups unless `accept_unrestorable=true`: those
        backups then become unrestorable. The bucket is not touched.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TargetID"
        - $ref: "#/components/parameters/AcceptUnrestorable"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage-targets/test:
    post:
      operationId: testStorageTarget
      summary: Run the live write/read/list/delete test without saving
      description: |
        With `target_id`, empty credentials are taken from that stored
        target (one of the organisation's, or a platform target for the
        platform admin).
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetTestRequest"
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/storage-targets:
    get:
      operationId: listPlatformStorageTargets
      summary: Platform storage targets (platform admin)
      description: Storage on platform targets counts against each organisation's backup quota. Org targets are not listed.
      tags: [admin]
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPlatformStorageTarget
      summary: Add a platform target after a live test (platform admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: The test failed; nothing was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/storage-targets/{target_id}:
    get:
      operationId: getPlatformStorageTarget
      summary: One platform target (platform admin)
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TargetID"
      responses:
        "200":
          description: Target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTarget"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePlatformStorageTarget
      summary: Change a platform target after a live test (platform admin)
      description: "`is_default: true` makes it the platform default (exactly one is)."
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TargetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: Test result; `saved` says whether the target changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePlatformStorageTarget
      summary: Delete a platform target (platform admin)
      description: The default can't be deleted; otherwise as for org targets.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TargetID"
        - $ref: "#/components/parameters/AcceptUnrestorable"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/storage-target:
    get:
      operationId: getProjectStorageTarget
      summary: Where the project's backups go, its key, and the targets it can use
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBackupStorage"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setProjectStorageTarget
      summary: Send the project's new backups to another target
      description: |
        `target_id` null is the platform default. Existing backups keep
        their target and stay restorable. `copy_existing` copies them to the
        new target as an operation, verified by checksum; `delete_originals`
        then deletes the originals. A dedicated project's WAL-G is
        reconfigured and a fresh base backup taken at once.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStorageTargetRequest"
      responses:
        "200":
          description: Switched; `operation` is set when work was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStorageTargetResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/backup-key:
    post:
      operationId: enableProjectBackupKey
      summary: Give the project its own backup key
      description: |
        Generates the key (idempotent unless `rotate`); new backups use it,
        existing backups keep theirs. Download it with
        `GET /projects/{id}/backup-key/download`.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectBackupKeyRequest"
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBackupKey"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/backup-key/download:
    get:
      operationId: downloadProjectBackupKey
      summary: Download the project's backup key with a README (re-authentication)
      description: |
        The OpenPGP private key, armored, after a README on decrypting and
        restoring with standard tools (gpg, pg_restore). Needs a recent
        re-authentication (403 `reauth_required`); every download is audited.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The key file.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/tokens:
    get:
      operationId: listOrgTokens
      summary: Every token scoped to the organisation (owners and admins)
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/tokens/{token_id}:
    delete:
      operationId: revokeOrgToken
      summary: Revoke any token scoped to the organisation (owners and admins)
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TokenID"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device:
    post:
      operationId: startDeviceLogin
      summary: Start a CLI device login
      description: |
        The CLI shows `user_code` and opens `verification_uri_complete`; a
        signed-in user approves it, choosing the organisation and scopes,
        and the CLI polls `/api/v1/auth/device/token` for the token.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStartRequest"
      responses:
        "200":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device/token:
    post:
      operationId: pollDeviceLogin
      summary: Collect a device login's token
      description: |
        Answers 400 with code `authorization_pending` until approved
        (`slow_down` when polled too often), then the token exactly once;
        `access_denied` or `expired_token` end the login.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePollRequest"
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device/requests/{user_code}:
    get:
      operationId: getDeviceLogin
      summary: A pending device login, for the approval page
      tags: [tokens]
      parameters:
        - name: user_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device/approve:
    post:
      operationId: approveDeviceLogin
      summary: Approve (or deny) a device login
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
      responses:
        "200":
          description: Approved; the CLI collects the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIToken"
        "204":
          description: Denied.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/settings/tokens:
    get:
      operationId: getTokenSettings
      summary: Platform-wide token rules
      tags: [admin]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putTokenSettings
      summary: Change the platform-wide token rules
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenSettings"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      summary: Your active sessions
      tags: [account]
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/sessions/{session_id}:
    delete:
      operationId: revokeMySession
      summary: End one of your sessions
      tags: [account]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Ended.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/recovery-codes:
    get:
      operationId: getRecoveryCodes
      summary: How many recovery codes you have left
      tags: [account]
      responses:
        "200":
          description: Count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace your recovery codes (step-up auth); shown once
      tags: [account]
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/terms/accept:
    post:
      operationId: acceptTerms
      summary: Accept the current terms of use
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTermsRequest"
      responses:
        "204":
          description: Accepted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/invitations:
    get:
      operationId: listMyInvitations
      summary: Invitations waiting for you
      tags: [account]
      responses:
        "200":
          description: Pending invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyInvitationList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/invitations/{invitation_id}/accept:
    post:
      operationId: acceptMyInvitation
      summary: Accept one of your pending invitations
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs:
    get:
      operationId: listOrgs
      summary: Organisations you belong to (personal first)
      tags: [orgs]
      responses:
        "200":
          description: Organisations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrg
      summary: Create an organisation; you become its owner
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}:
    get:
      operationId: getOrg
      summary: One organisation
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: The organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrg
      summary: Rename an organisation or change its settings
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOrg
      summary: Delete an organisation after a 7-day grace period (owner, step-up auth)
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOrgRequest"
      responses:
        "202":
          description: The organisation is offline and will be deleted at delete_after unless an owner cancels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDeletion"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/members:
    get:
      operationId: listOrgMembers
      summary: Members, their roles and project memberships
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMemberList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: inviteOrgMember
      summary: Invite someone to the organisation (and optionally to projects)
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invitation sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/members/{user}:
    patch:
      operationId: updateOrgMember
      summary: Change a member's organisation role
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgRoleRequest"
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeOrgMember
      summary: Remove a member; their access ends at once
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
