  /api/v1/nodes/{id}/metrics:
    get:
      operationId: getNodeMetrics
      summary: A node's metric series
      tags: [metrics]
      parameters:
        - $ref: "#/components/parameters/NodeID"
        - $ref: "#/components/parameters/MetricRange"
