openapi: 3.0.3
info:
  title: PGDock API
  version: 1.0.0
  description: |
    Control-plane API for PGDock. This file is the single source of truth:
    Go server interfaces (oapi-codegen) and TypeScript client types
    (openapi-typescript) are generated from it with `make generate`.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags: [system]
      responses:
        "200":
          description: The server is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build information for this server
      tags: [system]
      responses:
        "200":
          description: Version, commit, and build date of the running server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Email + password login; returns a TOTP challenge
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Password accepted; complete login with /auth/totp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/totp:
    post:
      operationId: postAuthTotp
      summary: Complete login with a TOTP code
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/reauth:
    post:
      operationId: postAuthReauth
      summary: Step-up authentication for destructive actions
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Step-up authentication granted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current operator
      tags: [auth]
      responses:
        "200":
          description: The logged-in operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Session state for the UI (public)
      description: |
        Whether first-run setup is needed, who is signed in, and the CSRF
        token to send as `X-CSRF-Token` on every mutating request (also set
        as the `pgdock_csrf` cookie).
      tags: [auth]
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
  /api/v1/setup/begin:
    post:
      operationId: beginSetup
      summary: First-run setup, step 1 - owner account and TOTP enrolment
      description: |
        Only before any operator exists. `setup_code` is printed in the
        pgdock-server log. Returns the TOTP secret to enrol; nothing is
        created until `/setup/complete` proves a code.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupBeginRequest"
      responses:
        "200":
          description: TOTP enrolment details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupEnrollment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: First-run setup, step 2 - confirm TOTP and create the owner
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
      responses:
        "200":
          description: Owner created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit log, newest first
      tags: [audit]
      parameters:
        - name: action
          in: query
          description: Action prefix, e.g. `project.` or `auth.login`.
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure, denied]
        - name: target_id
          in: query
          schema:
            type: string
        - name: before
          in: query
          description: Return entries with an id below this (pagination).
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/general:
    get:
      operationId: getGeneralSettings
      summary: DB hostname and pooler TLS status
      tags: [settings]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/db-host:
    put:
      operationId: putDbHost
      summary: Set the hostname clients use for databases
      description: Also starts obtaining the pooler's TLS certificate for it.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbHostRequest"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/db-host/check:
    post:
      operationId: checkDbHost
      summary: Check that a hostname resolves to this server
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbHostRequest"
      responses:
        "200":
          description: DNS check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsCheck"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations:
    get:
      operationId: listOperations
      summary: List operations, newest first
      tags: [operations]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OperationStatus"
        - name: kind
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Operations matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      summary: Get one operation, including its step log
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationID"
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations/{id}/stream:
    get:
      operationId: streamOperation
      summary: Stream an operation's progress as Server-Sent Events
      description: |
        Emits `log` events (data: OperationLogEntry, id: 1-based log index),
        `status` events (data: OperationStatusEvent) whenever the status
        changes, and a final `done` event before closing once the operation
        succeeds or fails. Reconnect with `Last-Event-ID` to resume after a
        log entry.
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationID"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/dev/operations:
    post:
      operationId: createDevOperation
      summary: Enqueue a dummy operation (development only)
      description: |
        Available only when the server runs with PGDOCK_DEV_ENDPOINTS=true;
        otherwise returns 404. Enqueues a `noop` operation for exercising
        the queue end to end.
      tags: [dev]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopParams"
      responses:
        "202":
          description: The operation was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects, newest first
      tags: [projects]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Live projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a shared-tier project
      description: |
        Records the project and queues a `create` operation. The response
        carries the password and full connection URLs exactly once; PGDock
        stores only the SCRAM verifier. The URLs work once the operation
        succeeds (stream it to follow progress).
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "202":
          description: Project recorded and create operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Project detail and connection info (no password)
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: |
        `confirm` must equal the project's name, and the session must have
        re-authenticated recently (`POST /auth/reauth`); otherwise 403 with
        code `reauth_required`. Queues a `delete` operation that takes a
        final backup (kept 30 days; `skip_final_backup` skips it), removes
        the pooler route, and drops the database and role.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: confirm
          in: query
          required: true
          schema:
            type: string
        - name: skip_final_backup
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Delete operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/settings:
    patch:
      operationId: updateProject
      summary: Update a project's name, description, or guardrails
      description: |
        Changes to guardrails that live on the backend or the pooler
        (connection limit, timeouts, pool size) queue an `apply_settings`
        operation, returned alongside the project.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/rotate-password:
    post:
      operationId: rotateProjectPassword
      summary: Rotate the project password
      description: |
        Returns the new password once and queues a `rotate` operation. The
        new password works, and the old one stops working, when it succeeds.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Rotate operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/backups:
    post:
      operationId: createProjectBackup
      summary: Back up a project now
      description: Queues a `backup` operation (a logical backup, kept by the nightly retention policy).
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Backup operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups:
    get:
      operationId: listBackups
      summary: List backups, newest first
      description: Includes final backups of deleted projects until they expire.
      tags: [backups]
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/BackupKind"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups/overview:
    get:
      operationId: getBackupOverview
      summary: Backup configuration and health at a glance
      tags: [backups]
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupOverview"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups/{id}/restore:
    post:
      operationId: restoreBackup
      summary: Restore a backup into a new project or in place
      description: |
        `mode: new` (the default, non-destructive) creates a project named
        `name` and returns its credentials once. `mode: in_place` replaces the
        backup's own project: `confirm` must equal the project's name and the
        session must have re-authenticated recently (403 `reauth_required`).
        It takes a safety backup first.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/BackupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Restore operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/restore-tests:
    post:
      operationId: runRestoreTest
      summary: Run the restore test now
      description: Restores the latest backup of a random project (or `project_id`) into a scratch database, counts every table, and drops it.
      tags: [backups]
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Restore test queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/storage:
    get:
      operationId: getStorageSettings
      summary: The backup storage target (never the secret key)
      tags: [settings]
      responses:
        "200":
          description: Storage settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putStorageSettings
      summary: Save the backup storage target after a live test
      description: Runs the write/read/delete test and saves only if it passes. An empty `secret_key` keeps the stored one.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageRequest"
      responses:
        "200":
          description: Test result; `saved` says whether the settings were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/storage/test:
    post:
      operationId: testStorageSettings
      summary: Run the live write/read/delete test without saving
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageRequest"
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/backup-key:
    get:
      operationId: getBackupKey
      summary: Whether the backup key exists and was confirmed
      tags: [settings]
      responses:
        "200":
          description: Key status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: generateBackupKey
      summary: Generate the backup encryption key
      description: Returns the key for download. Refuses (409) if one exists, since replacing it would make every backup unreadable.
      tags: [settings]
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyExport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/backup-key/export:
    post:
      operationId: exportBackupKey
      summary: Download the backup key again (requires re-authentication)
      tags: [settings]
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyExport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/backup-key/confirm:
    post:
      operationId: confirmBackupKey
      summary: Prove the key was saved by pasting it back
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupKeyConfirmRequest"
      responses:
        "200":
          description: Key status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/imports/preflight:
    post:
      operationId: importPreflight
      summary: Inspect a source database before importing it
      description: Connects read-only and changes nothing. The connection string is not stored.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSource"
      responses:
        "200":
          description: What the import would copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreflight"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/imports:
    post:
      operationId: createImport
      summary: Import an existing database into a new project
      description: |
        Creates the project and queues an `import` operation. The source
        connection string is held in memory for the operation only. The
        response carries the new project's password once.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: Project recorded and import queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: Nodes and their agents
      tags: [nodes]
      responses:
        "200":
          description: Nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createNode
      summary: Add a node; returns its one-time agent registration token
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:
        "201":
          description: The node and its token (shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/pitr:
    post:
      operationId: restoreProjectPITR
      summary: Point-in-time recovery of a dedicated project into a new one
      description: |
        Restores the newest base backup taken before `target_time` (default:
        now) and replays archived WAL up to it, into a new dedicated project
        on the same node with the same size. The response carries the new
        project's password once. The source is not changed.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PitrRequest"
      responses:
        "202":
          description: Restore operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/promote:
    get:
      operationId: getPromotionEstimate
      summary: Size and estimated write freeze of promoting this shared project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionEstimate"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: promoteProject
      summary: Promote a shared project to a dedicated instance
      description: |
        Queues a `promote` operation (spec §6.6): a dedicated instance with
        the same role and password, a short write freeze while the data is
        copied and verified, then the pooler route moves. Connection strings
        do not change. If anything fails before the route moves, the project
        stays on the shared tier untouched. The shared copy is kept
        read-only for 48 hours, then dropped.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteRequest"
      responses:
        "202":
          description: Promotion queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/instance:
    post:
      operationId: projectInstanceAction
      summary: Start, stop, or restart a dedicated project's instance
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceActionRequest"
      responses:
        "200":
          description: The instance after the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles:
    get:
      operationId: listProfiles
      summary: Dedicated instance sizes
      tags: [projects]
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}:
    get:
      operationId: getNode
      summary: A node, its agent's health, and what runs on it
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateNode
      summary: Change a node's role (where new projects may go)
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeNode
      summary: Take a node out of service (requires re-authentication)
      description: Refused (409) while instances run on it. Its agent's certificate stops being trusted.
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/shared-cluster:
    post:
      operationId: createSharedCluster
      summary: Run a shared cluster on this node (multi-node shared placement)
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedClusterRequest"
      responses:
        "202":
          description: Creation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/registration-token:
    post:
      operationId: createNodeRegistrationToken
      summary: Issue a one-time agent registration token (24 hours)
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "201":
          description: The token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationToken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agent/register:
    post:
      operationId: registerAgent
      summary: Agent registration (called by pgdock-agent, not the UI)
      description: |
        Exchanges a one-time registration token and a CSR for a client
        certificate signed by the PGDock agent CA. Needs no session; the
        token authenticates. Rate limited per address.
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisterRequest"
      responses:
        "200":
          description: Certificate issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisterResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/sql:
    post:
      operationId: runSQL
      summary: Run SQL in the project database (SQL console)
      description: |
        Runs as the project's role (spec §8.5), with a statement timeout
        (30s by default), at most 1,000 rows per result. When the project's
        console is read-only, or `read_only` is set, one statement runs
        inside `BEGIN READ ONLY … ROLLBACK`. Otherwise several statements
        may run in one submission. SQL errors are returned in the result's
        `error` with status 200. Only an audit entry is stored, never the
        query text.
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlRequest"
      responses:
        "200":
          description: What the statements returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/sql/cancel:
    post:
      operationId: cancelSQL
      summary: Cancel a running console query
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlCancelRequest"
      responses:
        "200":
          description: Whether a running query was found and cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlCancelResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/schema:
    get:
      operationId: getProjectSchema
      summary: Schemas, tables and views, with columns and indexes
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The schema tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbSchema"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/tables/{schema}/{table}/rows:
    get:
      operationId: getTableRows
      summary: A page of a table's rows (read-only)
      description: |
        50 rows per page, keyset-paginated on the primary key where there is
        one (spec §8.6). Pass the previous page's `next` as `after`.
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: schema
          in: path
          required: true
          schema:
            type: string
        - name: table
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/extensions:
    get:
      operationId: listProjectExtensions
      summary: The extension allow-list and what is installed
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Extensions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: enableProjectExtension
      summary: Enable an allow-listed extension
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableExtensionRequest"
      responses:
        "200":
          description: Extensions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/metrics:
    get:
      operationId: getProjectMetrics
      summary: A project's metric series and top queries
      tags: [metrics]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/MetricRange"
        - $ref: "#/components/parameters/MetricNames"
      responses:
        "200":
          description: Series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/metrics:
    get:
      operationId: getNodeMetrics
      summary: A node's metric series
      tags: [metrics]
      parameters:
        - $ref: "#/components/parameters/NodeID"
        - $ref: "#/components/parameters/MetricRange"
        - $ref: "#/components/parameters/MetricNames"
      responses:
        "200":
          description: Series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        default:
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Prometheus exposition of the latest metrics
      description: |
        Needs a signed-in operator, or `Authorization: Bearer <token>` with
        PGDOCK_METRICS_TOKEN.
      tags: [metrics]
      responses:
        "200":
          description: Text exposition format 0.0.4.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/security/isolation-checks:
    get:
      operationId: listIsolationChecks
      summary: The latest tenant-isolation check of each shared cluster
      description: |
        Each shared cluster is checked weekly against the §7.1 checklist:
        cluster settings and pg_hba.conf, every project's role and database,
        and two throwaway tenants that try to reach each other.
      tags: [security]
      responses:
        "200":
          description: Clusters and their latest checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsolationCheckList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: runIsolationChecks
      summary: Check every shared cluster now
      tags: [security]
      responses:
        "202":
          description: One isolation_check operation per running shared cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: Alerts, firing first
      tags: [alerts]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [firing, resolved]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/alerts:
    get:
      operationId: getAlertSettings
      summary: Alert channels (secrets only reported as set)
      tags: [alerts]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putAlertSettings
      summary: Set the webhook and email channels
      description: Omit a secret to keep the stored one; send an empty string to clear it. Omit smtp to turn email off.
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSettingsRequest"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/alerts/test:
    post:
      operationId: testAlertSettings
      summary: Send a test notification to every configured channel
      tags: [alerts]
      responses:
        "200":
          description: Per-channel results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertTestResult"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    MetricRange:
      name: range
      in: query
      schema:
        type: string
        enum: [1h, 24h, 7d]
        default: 24h
    MetricNames:
      name: metric
      in: query
      description: Metrics to return; all when omitted.
      schema:
        type: array
        items:
          type: string
    BackupID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Version:
      type: object
      required: [version, commit, build_date, go_version]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          example: 15506e9
        build_date:
          type: string
          example: "2026-10-01T00:00:00Z"
        go_version:
          type: string
          example: go1.25.0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginChallenge:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
    TotpRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
    ReauthRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
    Operator:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_implemented
        message:
          type: string
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    OperationLogEntry:
      type: object
      required: [ts, step, level, msg]
      properties:
        ts:
          type: string
          format: date-time
        step:
          type: string
        level:
          type: string
          enum: [info, warn, error]
        msg:
          type: string
    Operation:
      type: object
      required: [id, kind, params, status, attempts, run_after, log, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: create
        project_id:
          type: string
          format: uuid
          nullable: true
        params:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        run_after:
          type: string
          format: date-time
        log:
          type: array
          items:
            $ref: "#/components/schemas/OperationLogEntry"
        error:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    OperationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
    OperationStatusEvent:
      type: object
      required: [status, attempts]
      properties:
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        error:
          type: string
          nullable: true
    NoopParams:
      type: object
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 3
        delay_ms:
          type: integer
          minimum: 0
          maximum: 10000
          default: 500
        fail_attempts:
          type: integer
          minimum: 0
          default: 0
          description: Fail the first N attempts to exercise retries.
    ProjectStatus:
      type: string
      enum: [provisioning, active, promoting, restoring, deleting, error]
    ProjectTier:
      type: string
      enum: [shared, dedicated]
    ConnectionInfo:
      type: object
      required: [host, session_port, pooled_port, database, user, sslmode, pooled_url, session_url]
      properties:
        host:
          type: string
          example: db.example.com
        session_port:
          type: integer
          example: 5432
        pooled_port:
          type: integer
          example: 6543
        database:
          type: string
          example: blog_k2f9
        user:
          type: string
          example: blog_k2f9_owner
        sslmode:
          type: string
          example: require
        pooled_url:
          type: string
          description: Transaction-mode URL (app traffic). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:6543/blog_k2f9?sslmode=require
        session_url:
          type: string
          description: Session-mode URL (migrations). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:5432/blog_k2f9?sslmode=require
    Project:
      type: object
      required: [id, name, slug, db_name, owner_role, tier, status, settings, created_at, connection]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        db_name:
          type: string
        owner_role:
          type: string
        tier:
          $ref: "#/components/schemas/ProjectTier"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: string
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettings"
        created_at:
          type: string
          format: date-time
        connection:
          $ref: "#/components/schemas/ConnectionInfo"
        last_backup_at:
          type: string
          format: date-time
          nullable: true
          description: When the latest backup of this project finished.
        instance:
          $ref: "#/components/schemas/InstanceSummary"
        pitr_window:
          $ref: "#/components/schemas/PitrWindow"
        retired_copy_until:
          type: string
          format: date-time
          nullable: true
          description: After a promotion, when the read-only shared copy is dropped.
    ProjectSettings:
      type: object
      required: [connection_limit, pool_size, statement_timeout, idle_in_transaction_session_timeout, disk_warn_bytes, console_read_only]
      properties:
        connection_limit:
          type: integer
        pool_size:
          type: integer
        statement_timeout:
          type: string
        idle_in_transaction_session_timeout:
          type: string
        disk_warn_bytes:
          type: integer
          format: int64
        console_read_only:
          type: boolean
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: My Blog
        description:
          type: string
          maxLength: 1000
        tier:
          $ref: "#/components/schemas/ProjectTier"
        node_id:
          type: string
          format: uuid
          description: Dedicated only; default is the least loaded dedicated node.
        profile:
          type: string
          description: Dedicated only (see /profiles); default small.
        volume_gb:
          type: integer
          minimum: 1
          maximum: 16384
          description: Dedicated only; default 20.
    ProjectCredentials:
      type: object
      description: Shown once. PGDock keeps only the SCRAM verifier.
      required: [project, operation, password, connection]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        operation:
          $ref: "#/components/schemas/Operation"
        password:
          type: string
        connection:
          $ref: "#/components/schemas/ConnectionInfo"
    SessionState:
      type: object
      required: [authenticated, setup_required, csrf_token]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        csrf_token:
          type: string
        operator:
          $ref: "#/components/schemas/Operator"
        reauth_until:
          type: string
          format: date-time
          nullable: true
          description: Destructive actions are allowed without re-authenticating until then.
        idle_timeout_seconds:
          type: integer
    SetupBeginRequest:
      type: object
      required: [setup_code, email, password]
      properties:
        setup_code:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
    SetupEnrollment:
      type: object
      required: [enrollment_token, totp_secret, totp_uri, expires_at]
      properties:
        enrollment_token:
          type: string
        totp_secret:
          type: string
        totp_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    SetupCompleteRequest:
      type: object
      required: [enrollment_token, code]
      properties:
        enrollment_token:
          type: string
        code:
          type: string
    AuditEntry:
      type: object
      required: [id, action, outcome, detail, created_at]
      properties:
        id:
          type: integer
          format: int64
        operator_id:
          type: string
          format: uuid
          nullable: true
        operator_email:
          type: string
          nullable: true
        action:
          type: string
          example: project.create
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [success, failure, denied]
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_before:
          type: integer
          format: int64
          nullable: true
    DbHostRequest:
      type: object
      required: [db_host]
      properties:
        db_host:
          type: string
          example: db.example.com
    DnsCheck:
      type: object
      required: [host, addresses, server_addresses, points_here]
      properties:
        host:
          type: string
        addresses:
          type: array
          items:
            type: string
        server_addresses:
          type: array
          items:
            type: string
          description: Addresses this server considers its own.
        points_here:
          type: boolean
        error:
          type: string
          nullable: true
    TlsStatus:
      type: object
      required: [mode, state]
      properties:
        mode:
          type: string
          enum: [acme, self-signed, files, off]
        state:
          type: string
          enum: [ok, pending, error, off]
        host:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        not_after:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
    GeneralSettings:
      type: object
      required: [db_host, session_port, pooled_port, sslmode, tls]
      properties:
        db_host:
          type: string
        session_port:
          type: integer
        pooled_port:
          type: integer
        sslmode:
          type: string
        tls:
          $ref: "#/components/schemas/TlsStatus"
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 1000
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettingsPatch"
    ProjectSettingsPatch:
      type: object
      properties:
        connection_limit:
          type: integer
