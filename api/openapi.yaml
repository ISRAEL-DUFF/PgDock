        setup_required:
          type: boolean
        csrf_token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        signup_mode:
          type: string
          enum: [invite_only, approval, open]
        terms_required:
          type: integer
          nullable: true
          description: A terms version the user must accept before anything else.
        recovery_codes:
          type: array
          description: Set once, when this sign-in enrolled the authenticator.
          items:
            type: string
        reauth_until:
          type: string
          format: date-time
          nullable: true
          description: Destructive actions are allowed without re-authenticating until then.
        idle_timeout_seconds:
          type: integer
    SetupBeginRequest:
      type: object
      required: [setup_code, email, password]
      properties:
        setup_code:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
    SetupEnrollment:
      type: object
      required: [enrollment_token, totp_secret, totp_uri, expires_at]
      properties:
        enrollment_token:
          type: string
        totp_secret:
          type: string
        totp_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    SetupCompleteRequest:
      type: object
      required: [enrollment_token, code]
      properties:
        enrollment_token:
          type: string
        code:
          type: string
    AuditEntry:
      type: object
      required: [id, action, outcome, detail, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
          nullable: true
        user_email:
          type: string
          nullable: true
        actor_kind:
          type: string
          enum: [session, token, system]
        org_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        break_glass:
          type: boolean
        action:
          type: string
          example: project.create
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [success, failure, denied]
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_before:
          type: integer
          format: int64
          nullable: true
    DbHostRequest:
      type: object
      required: [db_host]
      properties:
        db_host:
          type: string
          example: db.example.com
    DnsCheck:
      type: object
      required: [host, addresses, server_addresses, points_here]
      properties:
        host:
          type: string
        addresses:
          type: array
          items:
            type: string
        server_addresses:
          type: array
          items:
            type: string
          description: Addresses this server considers its own.
        points_here:
          type: boolean
        error:
          type: string
          nullable: true
    TlsStatus:
      type: object
      required: [mode, state]
      properties:
        mode:
          type: string
          enum: [acme, self-signed, files, off]
        state:
          type: string
          enum: [ok, pending, error, off]
        host:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        not_after:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
    GeneralSettings:
      type: object
      required: [db_host, session_port, pooled_port, sslmode, tls]
      properties:
        db_host:
          type: string
        session_port:
          type: integer
        pooled_port:
          type: integer
        sslmode:
          type: string
        tls:
          $ref: "#/components/schemas/TlsStatus"
    BranchInfo:
      type: object
      required: [source, schema_only, backups]
      properties:
        source:
          type: string
          enum: [backup, live]
        schema_only:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the branch deletes itself; null keeps it.
        backups:
          type: boolean
          description: Whether it takes nightly backups.
    BranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        source:
          type: string
          enum: [backup, live]
          default: backup
        schema_only:
          type: boolean
          description: Defaults to whether the parent contains sensitive data.
        ttl_hours:
          type: integer
          minimum: 0
          maximum: 720
          description: Hours until the branch deletes itself (1 to 720; 0 keeps it). Default 168.
    BranchResetRequest:
      type: object
      properties:
        source:
          type: string
          enum: [backup, live]
          description: Defaults to the source the branch was created from.
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 1000
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettingsPatch"
        sensitive_data:
          type: boolean
          description: The project contains sensitive data; its branches default to schema only (project admins).
        expires_at:
          type: string
          format: date-time
          description: Branches only. When the branch deletes itself, within 30 days.
        no_expiry:
          type: boolean
          description: Branches only. Keep the branch until deleted.
        branch_backups:
          type: boolean
          description: Branches only. Take nightly backups (off by default).
    ProjectSettingsPatch:
      type: object
      properties:
        connection_limit:
          type: integer
          minimum: 1
          maximum: 1000
        pool_size:
          type: integer
          minimum: 1
          maximum: 1000
        statement_timeout:
          type: string
          description: Postgres duration such as `60s`; empty to unset.
        idle_in_transaction_session_timeout:
          type: string
        disk_warn_bytes:
          type: integer
          format: int64
          minimum: 0
        console_read_only:
          type: boolean
    ProjectUpdated:
      type: object
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        operation:
          $ref: "#/components/schemas/Operation"
    BackupKind:
      type: string
      enum: [logical, base, final, safety, metadata]
    Backup:
      type: object
      required: [id, kind, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        project_name:
          type: string
          nullable: true
        project_deleted:
          type: boolean
        kind:
          $ref: "#/components/schemas/BackupKind"
        status:
          type: string
          enum: [running, succeeded, failed, copied]
          description: "`copied`: copied to another target (the copy is its own backup); the original is kept until deleted."
        storage_target:
          type: string
          nullable: true
          description: The target's name ("an org target" where its name isn't the viewer's to see).
        storage_kind:
          $ref: "#/components/schemas/StorageTargetKind"
        encryption:
          type: string
          enum: [instance, project]
          description: "`project`: an OpenPGP message to the project's own key (opens with gpg)."
        key_fingerprint:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        checksum:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        operation_id:
          type: string
          format: uuid
          nullable: true
        error:
          type: string
          nullable: true
    BackupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
    BackupOverview:
      type: object
      required: [storage_configured, key, agent_available, window_hour_utc, retention_daily, retention_weekly]
      properties:
        storage_configured:
          type: boolean
        key:
          $ref: "#/components/schemas/BackupKeyInfo"
        agent_available:
          type: boolean
        window_hour_utc:
          type: integer
        retention_daily:
          type: integer
        retention_weekly:
          type: integer
        last_restore_test:
          $ref: "#/components/schemas/Operation"
        last_metadata_backup:
          $ref: "#/components/schemas/Backup"
    RestoreRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [new, in_place]
          default: new
        name:
          type: string
          description: Name of the new project (mode `new`).
          maxLength: 64
        confirm:
          type: string
          description: The project's name, typed (mode `in_place`).
    RestoreResponse:
      type: object
      required: [operation]
      properties:
        operation:
          $ref: "#/components/schemas/Operation"
        credentials:
          $ref: "#/components/schemas/ProjectCredentials"
    StorageTargetKind:
      type: string
      enum: [platform, org]
