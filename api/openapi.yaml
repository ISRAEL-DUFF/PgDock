        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/alerts:
    get:
      operationId: getAlertSettings
      summary: Alert channels (secrets only reported as set)
      tags: [alerts]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putAlertSettings
      summary: Set the webhook and email channels
      description: Omit a secret to keep the stored one; send an empty string to clear it. Omit smtp to turn email off.
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSettingsRequest"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/alerts/test:
    post:
      operationId: testAlertSettings
      summary: Send a test notification to every configured channel
      tags: [alerts]
      responses:
        "200":
          description: Per-channel results.
          content:
            application/json:
              schema:
