openapi: 3.0.3
info:
  title: PGDock API
  version: 1.0.0
  description: |
    Control-plane API for PGDock. This file is the single source of truth:
    Go server interfaces (oapi-codegen) and TypeScript client types
    (openapi-typescript) are generated from it with `make generate`.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags: [system]
      responses:
        "200":
          description: The server is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build information for this server
      tags: [system]
      responses:
        "200":
          description: Version, commit, and build date of the running server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Email + password login; returns a TOTP challenge
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Password accepted; complete login with /auth/totp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/totp:
    post:
      operationId: postAuthTotp
      summary: Complete login with a TOTP code
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/reauth:
    post:
      operationId: postAuthReauth
      summary: Step-up authentication for destructive actions
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Step-up authentication granted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current operator
      tags: [auth]
      responses:
        "200":
          description: The logged-in operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Session state for the UI (public)
      description: |
        Whether first-run setup is needed, who is signed in, and the CSRF
        token to send as `X-CSRF-Token` on every mutating request (also set
        as the `pgdock_csrf` cookie).
      tags: [auth]
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
  /api/v1/setup/begin:
    post:
      operationId: beginSetup
      summary: First-run setup, step 1 - owner account and TOTP enrolment
      description: |
        Only before any operator exists. `setup_code` is printed in the
        pgdock-server log. Returns the TOTP secret to enrol; nothing is
        created until `/setup/complete` proves a code.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupBeginRequest"
      responses:
        "200":
          description: TOTP enrolment details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupEnrollment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: First-run setup, step 2 - confirm TOTP and create the owner
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
      responses:
        "200":
          description: Owner created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit log, newest first
      tags: [audit]
      parameters:
        - name: action
          in: query
          description: Action prefix, e.g. `project.` or `auth.login`.
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure, denied]
        - name: target_id
          in: query
          schema:
            type: string
        - name: before
          in: query
          description: Return entries with an id below this (pagination).
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/general:
    get:
      operationId: getGeneralSettings
      summary: DB hostname and pooler TLS status
      tags: [settings]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/db-host:
    put:
      operationId: putDbHost
      summary: Set the hostname clients use for databases
      description: Also starts obtaining the pooler's TLS certificate for it.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbHostRequest"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/db-host/check:
    post:
      operationId: checkDbHost
      summary: Check that a hostname resolves to this server
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbHostRequest"
      responses:
        "200":
          description: DNS check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsCheck"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations:
    get:
      operationId: listOperations
      summary: List operations, newest first
      tags: [operations]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OperationStatus"
        - name: kind
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Operations matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      summary: Get one operation, including its step log
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationID"
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations/{id}/stream:
    get:
      operationId: streamOperation
      summary: Stream an operation's progress as Server-Sent Events
      description: |
        Emits `log` events (data: OperationLogEntry, id: 1-based log index),
        `status` events (data: OperationStatusEvent) whenever the status
        changes, and a final `done` event before closing once the operation
        succeeds or fails. Reconnect with `Last-Event-ID` to resume after a
        log entry.
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationID"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/dev/operations:
    post:
      operationId: createDevOperation
      summary: Enqueue a dummy operation (development only)
      description: |
        Available only when the server runs with PGDOCK_DEV_ENDPOINTS=true;
        otherwise returns 404. Enqueues a `noop` operation for exercising
        the queue end to end.
      tags: [dev]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopParams"
      responses:
        "202":
          description: The operation was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects, newest first
      tags: [projects]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Live projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a shared-tier project
      description: |
        Records the project and queues a `create` operation. The response
        carries the password and full connection URLs exactly once; PGDock
        stores only the SCRAM verifier. The URLs work once the operation
        succeeds (stream it to follow progress).
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "202":
          description: Project recorded and create operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Project detail and connection info (no password)
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: |
        `confirm` must equal the project's name, and the session must have
        re-authenticated recently (`POST /auth/reauth`); otherwise 403 with
        code `reauth_required`. Queues a `delete` operation that removes the
        pooler route and drops the database and role.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: confirm
          in: query
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Delete operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/settings:
    patch:
      operationId: updateProject
      summary: Update a project's name, description, or guardrails
      description: |
        Changes to guardrails that live on the backend or the pooler
        (connection limit, timeouts, pool size) queue an `apply_settings`
        operation, returned alongside the project.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/rotate-password:
    post:
      operationId: rotateProjectPassword
      summary: Rotate the project password
      description: |
        Returns the new password once and queues a `rotate` operation. The
        new password works, and the old one stops working, when it succeeds.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Rotate operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Version:
      type: object
      required: [version, commit, build_date, go_version]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          example: 15506e9
        build_date:
          type: string
          example: "2026-10-01T00:00:00Z"
        go_version:
          type: string
          example: go1.25.0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginChallenge:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
    TotpRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
    ReauthRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
    Operator:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_implemented
        message:
          type: string
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    OperationLogEntry:
      type: object
      required: [ts, step, level, msg]
      properties:
        ts:
          type: string
          format: date-time
        step:
          type: string
        level:
          type: string
          enum: [info, warn, error]
        msg:
          type: string
    Operation:
      type: object
      required: [id, kind, params, status, attempts, run_after, log, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: create
        project_id:
          type: string
          format: uuid
          nullable: true
        params:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        run_after:
          type: string
          format: date-time
        log:
          type: array
          items:
            $ref: "#/components/schemas/OperationLogEntry"
        error:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    OperationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
    OperationStatusEvent:
      type: object
      required: [status, attempts]
      properties:
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        error:
          type: string
          nullable: true
    NoopParams:
      type: object
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 3
        delay_ms:
          type: integer
          minimum: 0
          maximum: 10000
          default: 500
        fail_attempts:
          type: integer
          minimum: 0
          default: 0
          description: Fail the first N attempts to exercise retries.
    ProjectStatus:
      type: string
      enum: [provisioning, active, promoting, restoring, deleting, error]
    ProjectTier:
      type: string
      enum: [shared, dedicated]
    ConnectionInfo:
      type: object
      required: [host, session_port, pooled_port, database, user, sslmode, pooled_url, session_url]
      properties:
        host:
          type: string
          example: db.example.com
        session_port:
          type: integer
          example: 5432
        pooled_port:
          type: integer
          example: 6543
        database:
          type: string
          example: blog_k2f9
        user:
          type: string
          example: blog_k2f9_owner
        sslmode:
          type: string
          example: require
        pooled_url:
          type: string
          description: Transaction-mode URL (app traffic). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:6543/blog_k2f9?sslmode=require
        session_url:
          type: string
          description: Session-mode URL (migrations). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:5432/blog_k2f9?sslmode=require
    Project:
      type: object
      required: [id, name, slug, db_name, owner_role, tier, status, settings, created_at, connection]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        db_name:
          type: string
        owner_role:
          type: string
        tier:
          $ref: "#/components/schemas/ProjectTier"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: string
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettings"
        created_at:
          type: string
          format: date-time
        connection:
          $ref: "#/components/schemas/ConnectionInfo"
    ProjectSettings:
      type: object
      required: [connection_limit, pool_size, statement_timeout, idle_in_transaction_session_timeout, disk_warn_bytes, console_read_only]
      properties:
        connection_limit:
          type: integer
        pool_size:
          type: integer
        statement_timeout:
          type: string
        idle_in_transaction_session_timeout:
          type: string
        disk_warn_bytes:
          type: integer
          format: int64
        console_read_only:
          type: boolean
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: My Blog
        description:
          type: string
          maxLength: 1000
    ProjectCredentials:
      type: object
      description: Shown once. PGDock keeps only the SCRAM verifier.
      required: [project, operation, password, connection]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        operation:
          $ref: "#/components/schemas/Operation"
        password:
          type: string
        connection:
          $ref: "#/components/schemas/ConnectionInfo"
    SessionState:
      type: object
      required: [authenticated, setup_required, csrf_token]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        csrf_token:
          type: string
        operator:
          $ref: "#/components/schemas/Operator"
        reauth_until:
          type: string
          format: date-time
          nullable: true
          description: Destructive actions are allowed without re-authenticating until then.
        idle_timeout_seconds:
          type: integer
    SetupBeginRequest:
      type: object
      required: [setup_code, email, password]
      properties:
        setup_code:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
    SetupEnrollment:
      type: object
      required: [enrollment_token, totp_secret, totp_uri, expires_at]
      properties:
        enrollment_token:
          type: string
        totp_secret:
          type: string
        totp_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    SetupCompleteRequest:
      type: object
      required: [enrollment_token, code]
      properties:
        enrollment_token:
          type: string
        code:
          type: string
    AuditEntry:
      type: object
      required: [id, action, outcome, detail, created_at]
      properties:
        id:
          type: integer
          format: int64
        operator_id:
          type: string
          format: uuid
          nullable: true
        operator_email:
          type: string
          nullable: true
        action:
          type: string
          example: project.create
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [success, failure, denied]
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_before:
          type: integer
          format: int64
          nullable: true
    DbHostRequest:
      type: object
      required: [db_host]
      properties:
        db_host:
          type: string
          example: db.example.com
    DnsCheck:
      type: object
      required: [host, addresses, server_addresses, points_here]
      properties:
        host:
          type: string
        addresses:
          type: array
          items:
            type: string
        server_addresses:
          type: array
          items:
            type: string
          description: Addresses this server considers its own.
        points_here:
          type: boolean
        error:
          type: string
          nullable: true
    TlsStatus:
      type: object
      required: [mode, state]
      properties:
        mode:
          type: string
          enum: [acme, self-signed, files, off]
        state:
          type: string
          enum: [ok, pending, error, off]
        host:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        not_after:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
    GeneralSettings:
      type: object
      required: [db_host, session_port, pooled_port, sslmode, tls]
      properties:
        db_host:
          type: string
        session_port:
          type: integer
        pooled_port:
          type: integer
        sslmode:
          type: string
        tls:
          $ref: "#/components/schemas/TlsStatus"
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 1000
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettingsPatch"
    ProjectSettingsPatch:
      type: object
      properties:
        connection_limit:
          type: integer
          minimum: 1
          maximum: 1000
        pool_size:
          type: integer
          minimum: 1
          maximum: 1000
        statement_timeout:
          type: string
          description: Postgres duration such as `60s`; empty to unset.
        idle_in_transaction_session_timeout:
          type: string
        disk_warn_bytes:
          type: integer
          format: int64
          minimum: 0
        console_read_only:
          type: boolean
    ProjectUpdated:
      type: object
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        operation:
          $ref: "#/components/schemas/Operation"
