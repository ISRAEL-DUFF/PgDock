<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/style.css">
<link rel="alternate" type="application/rss+xml" title="{{.Title}} incidents" href="/feed.rss">
</head>

<footer>

</html>
