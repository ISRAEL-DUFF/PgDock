# PGDock development environment (spec §14, M0):
#   metadata-db      metadata Postgres for pgdock-server
#   shared-pg        the shared-tier cluster (projects become databases here)
#   pooler-session   PgBouncer, session mode      (prod :5432)
#   pooler-tx        PgBouncer, transaction mode  (prod :6543)
#
# Host ports are offset so they don't clash with a local Postgres; override
# them with the PGDOCK_DEV_*_PORT variables. Credentials are for local
# development only.
#
#   make dev-up      seed tmp/pooler, start everything, wait until healthy
#   make dev         run pgdock-server + Vite against it
#   make dev-down    stop (add -v to the compose command to drop data)
#
# The network has a fixed subnet so the test harness knows the gateway
# address (PGDOCK_DEV_GATEWAY): processes on the host listen there (the
# test control plane, a fake S3) and containers reach them through it.

name: pgdock-dev

services:
  metadata-db:
    image: postgres:18
    environment:
      POSTGRES_USER: pgdock
      POSTGRES_PASSWORD: pgdock
      POSTGRES_DB: pgdock
    ports:
      - "127.0.0.1:${PGDOCK_DEV_METADATA_PORT:-5440}:5432"
    volumes:
      - metadata-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdock -d pgdock"]
      interval: 2s
      timeout: 3s
      retries: 30

  shared-pg:
    image: postgres:18
    environment:
      POSTGRES_USER: pgdock_admin
      POSTGRES_PASSWORD: pgdock_admin
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    # §11.2 tuning, scaled down for a laptop.
    command:
      - postgres
      - -c
      - max_connections=500
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - autovacuum_max_workers=5
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=5s
      - -c
      - hba_file=/etc/pgdock/pg_hba.conf
      # Logical-replication moves (V3 §2.3).
      - -c
      - wal_level=logical
    ports:
      - "127.0.0.1:${PGDOCK_DEV_SHARED_PORT:-5441}:5432"
    volumes:
      - shared-data:/var/lib/postgresql
      - ./shared-pg-hba.conf:/etc/pgdock/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdock_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  pooler-session:
    image: edoburu/pgbouncer:v1.25.1-p0
    depends_on:
      shared-pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGDOCK_DEV_POOLER_SESSION_PORT:-6432}:5432"
    volumes:
      - ../pgbouncer/session.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # Generated by pgdock-server (a directory, so atomic renames show up).
      - ../../tmp/pooler:/etc/pgbouncer/pgdock:ro
    healthcheck: &pooler-health
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$(grep -E '^listen_port' /etc/pgbouncer/pgbouncer.ini | tr -dc 0-9)"]
      interval: 2s
      timeout: 3s
      retries: 30

  pooler-tx:
    image: edoburu/pgbouncer:v1.25.1-p0
    depends_on:
      shared-pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGDOCK_DEV_POOLER_TX_PORT:-6543}:6543"
    volumes:
      - ../pgbouncer/transaction.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # Generated by pgdock-server (a directory, so atomic renames show up).
      - ../../tmp/pooler:/etc/pgbouncer/pgdock:ro
    healthcheck: *pooler-health

  # A second pooler pair for the integration and isolation tests (`--profile
  # test`), so tests never rewrite the routes of a running dev server.
  pooler-session-test:
    image: edoburu/pgbouncer:v1.25.1-p0
    profiles: [test]
    depends_on:
      shared-pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGDOCK_TEST_POOLER_SESSION_PORT:-6442}:5432"
    volumes:
      - ../pgbouncer/session.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../../tmp/pooler-test:/etc/pgbouncer/pgdock:ro
    healthcheck: *pooler-health

  pooler-tx-test:
    image: edoburu/pgbouncer:v1.25.1-p0
    profiles: [test]
    depends_on:
      shared-pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGDOCK_TEST_POOLER_TX_PORT:-6553}:6543"
    volumes:
      - ../pgbouncer/transaction.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../../tmp/pooler-test:/etc/pgbouncer/pgdock:ro
    healthcheck: *pooler-health

  # M3 test fixtures (`--profile test`). The agent runs where Postgres 18
  # client tools are, on the Compose network like the poolers; the test
  # harness starts and stops it with `docker exec` (one per test).
  # The load test's second shared node (`--profile load`, V2 §14 M16).
  shared-pg-2:
    image: postgres:18
    profiles: [load]
    environment:
      POSTGRES_USER: pgdock_admin
      POSTGRES_PASSWORD: pgdock_admin
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    command: ["postgres", "-c", "hba_file=/etc/pgdock/pg_hba.conf", "-c", "max_connections=500", "-c", "wal_level=logical",
              "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=5s"]
    ports:
      - "127.0.0.1:${PGDOCK_DEV_LOAD2_PORT:-5443}:5432"
    volumes:
      - ./shared-pg-hba.conf:/etc/pgdock/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdock_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A shared cluster whose data directory is a 160 MB tmpfs (WAL lives
  # elsewhere), for the disk-full failure test.
  shared-pg-small:
    image: postgres:18
    profiles: [test]
    environment:
      POSTGRES_USER: pgdock_admin
      POSTGRES_PASSWORD: pgdock_admin
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
    command: ["postgres", "-c", "hba_file=/etc/pgdock/pg_hba.conf", "-c", "log_min_duration_statement=5s",
              "-c", "shared_buffers=32MB", "-c", "max_wal_size=64MB"]
    # Both in memory, so they always start empty together (WAL on its own,
    # larger tmpfs: only the data directory runs out of space).
    tmpfs:
      - /var/lib/postgresql/18/docker:size=160m,mode=0700,uid=999,gid=999
      - /var/lib/postgresql/wal:size=1g,mode=0700,uid=999,gid=999
    ports:
      - "127.0.0.1:${PGDOCK_DEV_SMALL_PORT:-5442}:5432"
    volumes:
      - ./shared-pg-hba.conf:/etc/pgdock/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdock_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  agent-test:
    image: postgres:18
    profiles: [test]
    entrypoint: ["sleep", "infinity"]
    stop_signal: SIGKILL
    ports:
      - "127.0.0.1:${PGDOCK_TEST_AGENT_PORT:-7071}:7070"
    volumes:
      - ../../tmp/bin:/pgdock:ro
      # Dedicated instances are sibling containers on this network (M4).
      - /var/run/docker.sock:/var/run/docker.sock

  # A second node's agent, for multi-node placement tests.
  agent-test-2:
    image: postgres:18
    profiles: [test]
    entrypoint: ["sleep", "infinity"]
    stop_signal: SIGKILL
    ports:
      - "127.0.0.1:${PGDOCK_TEST_AGENT2_PORT:-7072}:7070"
    volumes:
      - ../../tmp/bin:/pgdock:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # A third node, for the etcd cluster's third member and HA failover
  # tests (V3 §2.2).
  agent-test-3:
    image: postgres:18
    profiles: [test]
    entrypoint: ["sleep", "infinity"]
    stop_signal: SIGKILL
    ports:
      - "127.0.0.1:${PGDOCK_TEST_AGENT3_PORT:-7073}:7070"
    volumes:
      - ../../tmp/bin:/pgdock:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # A fourth node, for replacing an etcd member (V3.1 §3.2).
  agent-test-4:
    image: postgres:18
    profiles: [test]
    entrypoint: ["sleep", "infinity"]
    stop_signal: SIGKILL
    ports:
      - "127.0.0.1:${PGDOCK_TEST_AGENT4_PORT:-7074}:7070"
    volumes:
      - ../../tmp/bin:/pgdock:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # Import sources: a Supabase image and a plain Postgres 15. Published on
  # the gateway address so the control plane (host) and the agent
  # (container) use one connection string.
  src-supabase:
    image: mirror.gcr.io/supabase/postgres:17.6.1.003
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: supabase-source
    ports:
      - "${PGDOCK_DEV_GATEWAY:-172.31.251.1}:${PGDOCK_TEST_SRC_SUPABASE_PORT:-5450}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 60

  src-pg15:
    image: mirror.gcr.io/library/postgres:15
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: pg15-source
    ports:
      - "${PGDOCK_DEV_GATEWAY:-172.31.251.1}:${PGDOCK_TEST_SRC_PG15_PORT:-5451}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A Supabase hobby project for the migration helper's done-when (V4-M36):
  # Supabase's Postgres, its auth server (GoTrue) and its storage server
  # (with the S3 protocol), wired as Supabase's self-hosted setup does.
  supa-db:
    image: mirror.gcr.io/supabase/postgres:17.6.1.003
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: supabase-hobby
    volumes:
      - ./supabase/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - "${PGDOCK_DEV_GATEWAY:-172.31.251.1}:${PGDOCK_TEST_SUPA_DB_PORT:-5452}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 60

  supa-auth:
    image: mirror.gcr.io/supabase/gotrue:v2.180.0
    profiles: [test]
    depends_on:
      supa-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:supabase-hobby@supa-db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: pgdock-dev-supabase-jwt-secret-0123456789abcdef
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    ports:
      - "${PGDOCK_DEV_GATEWAY:-172.31.251.1}:${PGDOCK_TEST_SUPA_AUTH_PORT:-5453}:9999"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 60

  supa-storage:
    image: mirror.gcr.io/supabase/storage-api:v1.28.0
    profiles: [test]
    depends_on:
      supa-db:
        condition: service_healthy
      supa-auth:
        condition: service_healthy
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.BQiPH0yV7vzWKM64tfeTZvmyDQ9D2di_K6r9Q-s5_jk
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0._dKTsO2xm0IZae52aCMJnhBsvWs9nsSZi4cDQfWdDjQ
      AUTH_JWT_SECRET: pgdock-dev-supabase-jwt-secret-0123456789abcdef
      PGRST_JWT_SECRET: pgdock-dev-supabase-jwt-secret-0123456789abcdef
      DATABASE_URL: postgres://supabase_storage_admin:supabase-hobby@supa-db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: pgdock-supabase-s3-key
      S3_PROTOCOL_ACCESS_KEY_SECRET: pgdock-supabase-s3-secret-0123456789
    ports:
      - "${PGDOCK_DEV_GATEWAY:-172.31.251.1}:${PGDOCK_TEST_SUPA_STORAGE_PORT:-5454}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/status"]
      interval: 2s
      timeout: 3s
      retries: 60

networks:
  default:
    ipam:
      config:
        - subnet: ${PGDOCK_DEV_SUBNET:-172.31.251.0/24}
          gateway: ${PGDOCK_DEV_GATEWAY:-172.31.251.1}

volumes:
  metadata-data:
  shared-data:
