; PgBouncer, session mode (development).
;
; pgdock-server owns the routes and the auth file (spec §5.2). It writes
; them into PGDOCK_POOLER_CONFIG_DIR (tmp/pooler in dev, mounted at
; /etc/pgbouncer/pgdock) and RELOADs. `make dev-up` seeds that directory
; from deploy/dev/pgbouncer/bootstrap so the poolers can start first.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =

pool_mode = session
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/pgdock/userlist.txt
admin_users = pgdock
stats_users = pgdock

max_client_conn = 2000
default_pool_size = 5
server_tls_sslmode = prefer
ignore_startup_parameters = extra_float_digits,options


; Generated routes. Keep this last: the file starts its own [databases] section.
%include /etc/pgbouncer/pgdock/databases.ini
