; PgBouncer, transaction mode (development). From M1 on, pgdock-server renders
; the [databases] routes and the auth file (spec §5.2); this file only
; holds the static settings.

[databases]
; Smoke-test route to the shared cluster. Real routes look like:
;   blog_k2f9 = host=shared-pg port=5432 dbname=blog_k2f9
pgdock_smoke = host=shared-pg port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
unix_socket_dir =

pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgdock
stats_users = pgdock

max_client_conn = 2000
default_pool_size = 5
max_db_connections = 20
server_tls_sslmode = disable
ignore_startup_parameters = extra_float_digits,options
; Lets ORMs that use prepared statements work in transaction mode.
max_prepared_statements = 200
