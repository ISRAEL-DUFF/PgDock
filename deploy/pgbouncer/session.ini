; PgBouncer, session mode. Shared by the dev environment and the install
; bundle.
;
; pgdock-server owns the routes, the auth file, and the TLS certificate
; (spec §5.2). It writes them into PGDOCK_POOLER_CONFIG_DIR, mounted here at
; /etc/pgbouncer/pgdock, and RELOADs. In dev, `make dev-up` seeds that
; directory so the poolers can start before the server has run.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =

pool_mode = session
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/pgdock/userlist.txt
admin_users = pgdock
stats_users = pgdock

max_client_conn = 2000
; Close idle server connections after 30s (default 10 min): with hundreds
; of projects, idle backends would otherwise crowd the shared cluster's
; max_connections (load test, docs/load-test.md).
server_idle_timeout = 30
default_pool_size = 5
server_tls_sslmode = prefer

; Clients must use TLS (spec §3.3). pgdock-server keeps the certificate in
; the generated directory current and RELOADs on change.
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/pgdock/server.crt
client_tls_key_file = /etc/pgbouncer/pgdock/server.key
client_tls_protocols = tlsv1.2,tlsv1.3
ignore_startup_parameters = extra_float_digits,options


; Generated routes. Keep this last: the file starts its own [databases] section.
%include /etc/pgbouncer/pgdock/databases.ini
