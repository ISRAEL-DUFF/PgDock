# PGDock on a single host (spec §11.1): Caddy, pgdock-server, the metadata
# database, the shared PostgreSQL 18 cluster, the two PgBouncer poolers, and
# the node agent (backups, restores, imports, and dedicated instances).
#
#   ./install.sh            writes .env with generated secrets, then starts it
#   docker compose up -d    (with an existing .env)
#
# Then open https://$PGDOCK_UI_DOMAIN and enter the setup code from
# `docker compose logs pgdock-server`.

name: pgdock

x-pooler: &pooler
  image: edoburu/pgbouncer:v1.25.1-p0
  restart: unless-stopped
  depends_on:
    pgdock-server:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 $$(grep -E '^listen_port' /etc/pgbouncer/pgbouncer.ini | tr -dc 0-9)"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${PGDOCK_HTTP_PORT:-80}:80"
      - "${PGDOCK_HTTPS_PORT:-443}:443"
    environment:
      PGDOCK_UI_DOMAIN: ${PGDOCK_UI_DOMAIN:?set PGDOCK_UI_DOMAIN in .env}
      PGDOCK_ACME_EMAIL: ${PGDOCK_ACME_EMAIL:?set PGDOCK_ACME_EMAIL in .env}
      CADDY_UI_TLS: ${CADDY_UI_TLS:-}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.31.250.10

  pgdock-server:
    image: ${PGDOCK_IMAGE:-pgdock:local}
    build:
      context: ../..
    restart: unless-stopped
    depends_on:
      metadata-db:
        condition: service_healthy
      shared-pg:
        condition: service_healthy
    environment:
      PGDOCK_DATABASE_URL: postgres://pgdock:${METADATA_DB_PASSWORD:?}@metadata-db:5432/pgdock?sslmode=disable
      PGDOCK_MASTER_KEY: ${PGDOCK_MASTER_KEY:?run install.sh or set PGDOCK_MASTER_KEY}
      PGDOCK_LOG_FORMAT: ${PGDOCK_LOG_FORMAT:-json}
      # Caddy terminates TLS; trust its X-Forwarded-For.
      PGDOCK_TRUSTED_PROXIES: 172.31.250.10
      # Links in account, invitation, and alert email.
      PGDOCK_PUBLIC_URL: ${PGDOCK_PUBLIC_URL:-https://${PGDOCK_UI_DOMAIN}}
      PGDOCK_PUBLIC_IPS: ${PGDOCK_PUBLIC_IPS:-}
      PGDOCK_SETUP_CODE: ${PGDOCK_SETUP_CODE:-}
      PGDOCK_SHARED_ADMIN_URL: postgres://pgdock_admin:${SHARED_ADMIN_PASSWORD:?}@shared-pg:5432/postgres?sslmode=disable
      PGDOCK_SHARED_POOLER_HOST: shared-pg
      PGDOCK_POOLER_ADMIN_PASSWORD: ${POOLER_ADMIN_PASSWORD:?}
      PGDOCK_POOLER_SESSION_ADDR: pooler-session:5432
      PGDOCK_POOLER_POOLED_ADDR: pooler-tx:6543
      PGDOCK_POOLER_SSLMODE: require
      PGDOCK_POOLER_TLS: ${PGDOCK_POOLER_TLS:-acme}
      PGDOCK_ACME_EMAIL: ${PGDOCK_ACME_EMAIL:?}
      PGDOCK_ACME_CA: ${PGDOCK_ACME_CA:-}
      PGDOCK_ACME_CA_ROOTS: ${PGDOCK_ACME_CA_ROOTS:-}
      # The wizard sets the DB hostname; this is only the starting value.
      PGDOCK_DB_HOST: ${PGDOCK_DB_HOST:-${PGDOCK_UI_DOMAIN}}
      PGDOCK_DB_SESSION_PORT: ${PGDOCK_DB_SESSION_PORT:-5432}
      PGDOCK_DB_POOLED_PORT: ${PGDOCK_DB_POOLED_PORT:-6543}
      PGDOCK_DB_SSLMODE: require
      # Lets the bundled agent register the local node by itself.
      PGDOCK_AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:?run install.sh or set AGENT_BOOTSTRAP_TOKEN}
      PGDOCK_BACKUP_HOUR: ${PGDOCK_BACKUP_HOUR:-2}
      PGDOCK_METRICS_INTERVAL: ${PGDOCK_METRICS_INTERVAL:-1m}
      PGDOCK_TENANCY_SWEEP_INTERVAL: ${PGDOCK_TENANCY_SWEEP_INTERVAL:-5m}
      # Query insights (V3 §8): which plans get them, how often
      # pg_stat_statements is read, and the slow-query threshold.
      PGDOCK_INSIGHTS_PLANS: ${PGDOCK_INSIGHTS_PLANS:-pro,team}
      PGDOCK_INSIGHTS_INTERVAL: ${PGDOCK_INSIGHTS_INTERVAL:-5m}
      PGDOCK_SLOW_QUERY_MS: ${PGDOCK_SLOW_QUERY_MS:-1000}
      PGDOCK_METRICS_TOKEN: ${PGDOCK_METRICS_TOKEN:-}
      PGDOCK_CONSOLE_DISABLED: ${PGDOCK_CONSOLE_DISABLED:-false}
      # The waker answers paused Free projects' connections (V3 §4.2); the
      # poolers reach it at this address. Pooler hosts elsewhere need the
      # server's private address instead (docs/free-tier.md).
      PGDOCK_WAKER_ADDR: ${PGDOCK_WAKER_ADDR:-172.31.250.11:6435}
      PGDOCK_WAKER_LISTEN: ${PGDOCK_WAKER_LISTEN:-:6435}
      # Open signup's protection (V3 §7.4).
      PGDOCK_TURNSTILE_SITE_KEY: ${PGDOCK_TURNSTILE_SITE_KEY:-}
      PGDOCK_TURNSTILE_SECRET: ${PGDOCK_TURNSTILE_SECRET:-}
      PGDOCK_SIGNUPS_PER_IP: ${PGDOCK_SIGNUPS_PER_IP:-3}
      # Support (V3 §7.1, docs/support.md): the inbox, the email
      # provider's inbound webhook secret, and WhatsApp's Cloud API.
      PGDOCK_SUPPORT_EMAIL: ${PGDOCK_SUPPORT_EMAIL:-}
      PGDOCK_SUPPORT_INBOUND_SECRET: ${PGDOCK_SUPPORT_INBOUND_SECRET:-}
      PGDOCK_WHATSAPP_PHONE_NUMBER_ID: ${PGDOCK_WHATSAPP_PHONE_NUMBER_ID:-}
      PGDOCK_WHATSAPP_ACCESS_TOKEN: ${PGDOCK_WHATSAPP_ACCESS_TOKEN:-}
      PGDOCK_WHATSAPP_APP_SECRET: ${PGDOCK_WHATSAPP_APP_SECRET:-}
      PGDOCK_WHATSAPP_VERIFY_TOKEN: ${PGDOCK_WHATSAPP_VERIFY_TOKEN:-}
      # Capacity automation (V3 §5, docs/capacity.md): the provider new
      # servers come from, and what their cloud-init runs.
      PGDOCK_REGION: ${PGDOCK_REGION:-eu-central}
      PGDOCK_CLOUD_PROVIDER: ${PGDOCK_CLOUD_PROVIDER:-manual}
      PGDOCK_HETZNER_TOKEN: ${PGDOCK_HETZNER_TOKEN:-}
      PGDOCK_HETZNER_LOCATION: ${PGDOCK_HETZNER_LOCATION:-fsn1}
      PGDOCK_HETZNER_NETWORK_ID: ${PGDOCK_HETZNER_NETWORK_ID:-}
      PGDOCK_HETZNER_PLACEMENT_GROUP_ID: ${PGDOCK_HETZNER_PLACEMENT_GROUP_ID:-}
      PGDOCK_HETZNER_SSH_KEYS: ${PGDOCK_HETZNER_SSH_KEYS:-}
      PGDOCK_CLOUD_AGENT_IMAGE: ${PGDOCK_CLOUD_AGENT_IMAGE:-}
      PGDOCK_CLOUD_PG_IMAGE: ${PGDOCK_CLOUD_PG_IMAGE:-}
      PGDOCK_CLOUD_SERVER_URL: ${PGDOCK_CLOUD_SERVER_URL:-}
      PGDOCK_CLOUD_PRIVATE_CIDR: ${PGDOCK_CLOUD_PRIVATE_CIDR:-10.0.0.0/16}
    volumes:
      - pgdock-data:/var/lib/pgdock
      - pooler-config:/var/lib/pgdock/pooler
    healthcheck:
      test: ["CMD", "/usr/local/bin/pgdock-server", "-healthcheck", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      retries: 30
    # Fixed addresses: the shared cluster's pg_hba.conf names them.
    networks:
      default:
        ipv4_address: 172.31.250.11

  # The local node's agent: it runs pg_dump/pg_restore next to the shared
  # cluster and registers with the bootstrap token on first start (mTLS
  # from then on; the CA is pinned in agent-state).
  pgdock-agent:
    image: ${PGDOCK_AGENT_IMAGE:-pgdock-agent:local}
    build:
      context: ../..
      target: agent
    restart: unless-stopped
    depends_on:
      pgdock-server:
        condition: service_healthy
    # Root, for the Docker socket: dedicated instances are sibling
    # containers on this network (spec §4.2).
    user: "0:0"
    environment:
      PGDOCK_AGENT_SERVER: http://pgdock-server:8080
      PGDOCK_AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:?}
      PGDOCK_AGENT_NODE: local
      PGDOCK_AGENT_ADVERTISE: pgdock-agent:7070
      PGDOCK_AGENT_LOG_FORMAT: ${PGDOCK_LOG_FORMAT:-json}
      PGDOCK_AGENT_NETWORK: ${PGDOCK_NETWORK:-pgdock}
      PGDOCK_AGENT_PG_IMAGE: ${PGDOCK_PG_IMAGE:-pgdock-postgres:{major}-walg3.0.9}
      # Instances accept logins from pgdock-server, the poolers, and this
      # agent only (spec §7.1). Add a remote control node's address here.
      PGDOCK_AGENT_DB_ALLOW: ${PGDOCK_AGENT_DB_ALLOW:-172.31.250.11/32,172.31.250.12/32,172.31.250.13/32,172.31.250.14/32}
      # Moves (V3 §2.3): instances on this network replicate from each other
      # and from the shared cluster, as each move's own login only.
      PGDOCK_AGENT_MOVE_ALLOW: ${PGDOCK_AGENT_MOVE_ALLOW:-172.31.250.0/24}
    volumes:
      - agent-state:/var/lib/pgdock-agent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        ipv4_address: 172.31.250.14

  metadata-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgdock
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?}
      POSTGRES_DB: pgdock
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - metadata-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdock -d pgdock"]
      interval: 2s
      timeout: 3s
      retries: 30

  shared-pg:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgdock_admin
      POSTGRES_PASSWORD: ${SHARED_ADMIN_PASSWORD:?}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    # §11.2 tuning for an 8 GB host; adjust for yours.
    command:
      - postgres
      - -c
      - max_connections=500
      - -c
      - shared_buffers=${SHARED_PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${SHARED_PG_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - autovacuum_max_workers=5
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=5s
      - -c
      - log_statement=none
      - -c
      - hba_file=/etc/pgdock/pg_hba.conf
      # Moves by logical replication (V3 §2.3); changing it restarts the
      # cluster once.
      - -c
      - wal_level=logical
    volumes:
      - shared-data:/var/lib/postgresql
      - ./shared-pg-hba.conf:/etc/pgdock/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdock_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  pooler-session:
    <<: *pooler
    ports:
      - "${PGDOCK_DB_SESSION_PORT:-5432}:5432"
    volumes:
      - ../pgbouncer/session.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pooler-config:/etc/pgbouncer/pgdock:ro
    networks:
      default:
        ipv4_address: 172.31.250.12

  pooler-tx:
    <<: *pooler
    ports:
      - "${PGDOCK_DB_POOLED_PORT:-6543}:6543"
    volumes:
      - ../pgbouncer/transaction.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pooler-config:/etc/pgbouncer/pgdock:ro
    networks:
      default:
        ipv4_address: 172.31.250.13

networks:
  default:
    # Named, so the agent can attach dedicated instances to it.
    name: ${PGDOCK_NETWORK:-pgdock}
    ipam:
      config:
        - subnet: 172.31.250.0/24
          # Dynamic addresses stay clear of the fixed ones (.10 to .20).
          ip_range: 172.31.250.128/25

volumes:
  caddy-data:
  caddy-config:
  pgdock-data:
  pooler-config:
  metadata-data:
  shared-data:
  agent-state:
