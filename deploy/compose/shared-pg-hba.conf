# pg_hba.conf for the bundle's shared cluster (spec §7.1): only the control
# plane (pgdock-server, the agent) and the two poolers may log in, from
# their fixed addresses on the bundle's private network, with SCRAM.
# Traffic stays on that Docker network, so TLS is not needed here.
#
# TYPE  DATABASE  USER  ADDRESS            METHOD
local   all       all                      trust
host    all       all   172.31.250.11/32   scram-sha-256
host    all       all   172.31.250.12/32   scram-sha-256
host    all       all   172.31.250.13/32   scram-sha-256
host    all       all   172.31.250.14/32   scram-sha-256
