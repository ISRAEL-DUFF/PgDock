# xenibase-status configuration (V3 §2.6). Copy to status.toml and edit.
# Check it with: xenibase-status check-config --config status.toml

# Where the page is reached (links in emails and the RSS feed).
public_url = "https://status.example.com"
title = "Xenibase status"
listen = ":8080"
data = "/var/lib/xenibase-status/status.db"

# One check a minute: the SLA counts minutes (V3 §2.7).
interval = "1m"
# Failing checks in a row before an incident opens by itself, and good
# ones before it resolves by itself.
fail_after = 3
recover_after = 2

# xenibase-server signs heartbeats and incidents with this secret
# (XENIBASE_STATUS_PUSH_SECRET on the Xenibase side). At least 32 characters:
#   openssl rand -hex 32
push_secret_file = "/run/secrets/xenibase-status-push"
# Heartbeat components show "unknown" after this long without one.
heartbeat_ttl = "5m"

# Behind a reverse proxy that sets X-Forwarded-For (Caddy, nginx).
trust_proxy = true

# Email subscriptions (double opt-in). Leave out to disable them.
[smtp]
host = "smtp.example.net"
port = 587
tls = "starttls"
username = "status@example.com"
password_file = "/run/secrets/xenibase-status-smtp"
from = "Xenibase status <status@example.com>"

# ---- Components, probed from here ----------------------------------------

[[component]]
id = "dashboard"
name = "Control plane & dashboard"
region = "eu-central"
  [[component.probe]]
  name = "dashboard"
  kind = "http"
  url = "https://xenibase.example.com/healthz"

# The floating IP on both ports, as a low-privilege probe role into a
# small probe database (docs/status-page.md).
[[component]]
id = "edge-pooler"
name = "Edge pooler"
region = "eu-central"
  [[component.probe]]
  name = "session port"
  kind = "postgres"
  dsn_file = "/run/secrets/xenibase-status-probe-session"
  [[component.probe]]
  name = "transaction port"
  kind = "postgres"
  dsn_file = "/run/secrets/xenibase-status-probe-transaction"

# The shared tier: a write through the pooler (txid_current needs a
# writable primary).
[[component]]
id = "shared-tier"
name = "Shared tier"
region = "eu-central"
  [[component.probe]]
  name = "probe database"
  kind = "postgres"
  dsn_file = "/run/secrets/xenibase-status-probe-transaction"
  query = "SELECT txid_current()"

# ---- Components reported by xenibase-server's heartbeats ---------------------

[[component]]
id = "dedicated"
name = "Dedicated instances"
region = "eu-central"
heartbeat = true

[[component]]
id = "backups"
name = "Backups"
region = "eu-central"
heartbeat = true

[[component]]
id = "webhooks-jobs"
name = "Webhooks & jobs"
region = "eu-central"
heartbeat = true

# Billing (V4.1): degraded while a payment provider is unreachable, or
# when last month's invoices haven't issued by the 2nd.
[[component]]
id = "billing"
name = "Billing & payments"
heartbeat = true

# Backend services, one line per region (V4.1): xenibase-server reports each
# region's edges (degraded when some stop reporting, down when all do);
# the probe checks the region's edge from outside. The worse of the two
# is shown. Add one block per region, with that region's edge address.
[[component]]
id = "backend-services-eu-central"
name = "Backend services"
region = "eu-central"
heartbeat = true
heartbeat_id = "backend-services"
  [[component.probe]]
  name = "edge"
  kind = "http"
  url = "https://healthz.api.example.com/healthz"
