name: Move at full size

# M18's done-when at its full size (V4.1 §13): a 20 GB dedicated project
# moves nodes under continuous writes with seconds of paused writes and no
# lost commits. It needs about three times the size in free disk, more than
# a standard GitHub runner has, so it runs only by hand, on a runner you
# name (a larger hosted runner or a self-hosted one).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label with at least 3× the size in free disk (e.g. ubuntu-latest-8-cores, or self-hosted)
        required: true
        default: ubuntu-latest
      size_gb:
        description: Project size in GB
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  move:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Free disk
        env:
          SIZE_GB: ${{ inputs.size_gb }}
        run: |
          case "$SIZE_GB" in ''|*[!0-9]*) echo "::error::size_gb must be a whole number"; exit 1;; esac
          df -h /
          need=$(( SIZE_GB * 3 ))
          have=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          echo "need ${need}G, have ${have}G"
          [ "$have" -ge "$need" ] || { echo "::error::this runner has ${have}G free; the move needs about ${need}G"; exit 1; }

      - name: Move under load
        env:
          SIZE_GB: ${{ inputs.size_gb }}
        run: set -o pipefail; make test-move PGDOCK_TEST_MOVE_GB="$SIZE_GB" 2>&1 | tee move.log

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: move-${{ inputs.size_gb }}gb
          path: move.log
