name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pgdock
          POSTGRES_PASSWORD: pgdock
          POSTGRES_DB: pgdock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgdock"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGDOCK_TEST_DATABASE_URL: postgres://pgdock:pgdock@127.0.0.1:5432/pgdock?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Go lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

      - name: Go tests (including Postgres-backed)
        run: make test-go

      - name: Frontend type-check and tests
        run: make test-web

      - name: Generated code is up to date
        run: make check-generated

      - name: Build UI and binaries
        run: make build

      - name: Binary embeds the real UI
        run: make release-check
